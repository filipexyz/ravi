name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "examples/**"
      - "extensions/**"
      - ".claude-plugin/**"
      - ".markdownlint.jsonc"
      - ".githooks/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/site.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "Makefile"
      - ".env.example"
      - "LICENSE"
  # Stacked PRs must run the same checks when targeting another feature branch.
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2.1"

      - name: Test Swift SDK
        run: |
          swift --version
          bun run test:swift-sdk

      # The quality gate is diff-based and must evaluate the pull request delta.
      # Push events on long-lived branches can include merge commits or branch
      # divergence that make `origin/<base>...HEAD` much broader than the change
      # being validated; build/typecheck/test still run for those pushes.
      - name: Quality Gate (specs + coverage)
        if: github.event_name == 'pull_request'
        run: bun src/ci/run-quality-gate.ts
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Reverts delete a feature and its focused tests, so the coverage gate
          # would never see a test in the diff. This is an explicit signal, opt-in
          # per PR via the `revert` label or a `revert` title prefix. It only
          # exempts the focused-coverage check; every other gate is unchanged.
          QUALITY_GATE_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'revert') || startsWith(github.event.pull_request.title, 'revert') }}
