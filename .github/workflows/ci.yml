name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "examples/**"
      - "extensions/**"
      - ".claude-plugin/**"
      - ".markdownlint.jsonc"
      - ".githooks/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/site.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "Makefile"
      - ".env.example"
      - "LICENSE"
  # Stacked PRs must run the same checks when targeting another feature branch.
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The immutable ratchet anchor is outside dev's history. Keep it reachable
      # via this tag and require that tag explicitly, even with full history.
      - name: Fetch error cause baseline anchor
        run: git fetch --no-tags origin refs/tags/error-cause-baseline:refs/tags/error-cause-baseline

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Isolate Ravi state
        run: echo "RAVI_STATE_DIR=$RUNNER_TEMP/ravi-ci-state" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Error cause ratchet
        run: |
          bun node_modules/typescript/bin/tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --types bun-types scripts/error-cause-scan.ts scripts/error-cause-scan.test.ts
          bun test scripts/error-cause-scan.test.ts
          bun scripts/error-cause-scan.ts
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # PR synchronize.before is the old head and may disappear after rebase.
          ERROR_CAUSE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          ERROR_CAUSE_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Test state ownership
        run: bun test src/router/state-boundary.test.ts src/db/schema-owner.test.ts src/test/ravi-state.test.ts

      - name: Test Swift SDK
        run: bun run test:swift-sdk

      # The quality gate is diff-based and must evaluate the pull request delta.
      # Push events on long-lived branches can include merge commits or branch
      # divergence that make `origin/<base>...HEAD` much broader than the change
      # being validated; build/typecheck/test still run for those pushes.
      - name: Quality Gate (specs + coverage)
        if: github.event_name == 'pull_request'
        run: bun src/ci/run-quality-gate.ts
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Reverts delete a feature and its focused tests, so the coverage gate
          # would never see a test in the diff. This is an explicit signal, opt-in
          # per PR via the `revert` label or a `revert` title prefix. It only
          # exempts the focused-coverage check; every other gate is unchanged.
          QUALITY_GATE_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'revert') || startsWith(github.event.pull_request.title, 'revert') }}
