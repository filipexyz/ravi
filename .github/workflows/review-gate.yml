name: Review Gate

on:
  # Deliberately no path/branch filters: even docs-only PRs need review evidence.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# No dependency install, secrets, write token or pull_request_target execution of PR code.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate-tests:
    name: Review Gate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun test src/ci/review-gate.test.ts

  review-gate:
    name: Review Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Evaluate complete review evidence on the event head SHA
        run: node src/ci/review-gate.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
